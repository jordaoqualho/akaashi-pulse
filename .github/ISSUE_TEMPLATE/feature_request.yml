name: Feature request
description: Suggest an improvement or a new insight.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the question you can't answer today, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This works without sending prompts, code, or paths off my machine.
          required: true
